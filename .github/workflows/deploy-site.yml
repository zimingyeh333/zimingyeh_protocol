name: Deploy Zimingyeh Protocol Site

on:
  push:
    branches:
      - main
    paths:
      - '.github/site/**'
      - 'Zimingyeh_protocol/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit advisory
        run: npm run audit:security
        continue-on-error: true

      - name: Build and publish-readiness audit
        run: npm run audit:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
