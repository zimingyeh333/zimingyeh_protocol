<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DPBS selection thumbnail</title>
  <desc id="desc">A decision thumbnail for choosing DPBS versions based on cell dissociation, tissue adhesion maintenance, optical assays, and PBS comparison.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #c9d7e3; stroke-width: 2; rx: 18; }
      .main { fill: #edf7ff; stroke: #3a7ca5; stroke-width: 3; rx: 20; }
      .note { fill: #f4fbf5; stroke: #78b889; stroke-width: 2; rx: 16; }
      .warn { fill: #fff4ee; stroke: #e6a184; stroke-width: 2; rx: 16; }
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 42px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 21px; fill: #4d6578; }
      .label { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 24px; font-weight: 700; fill: #17324d; }
      .text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #324c5f; }
      .small { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #516b7e; }
      .tag { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #7f9ab1; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .blue { fill: #2f80ed; }
      .green { fill: #219653; }
      .orange { fill: #f2994a; }
      .red { fill: #eb5757; }
      .purple { fill: #7b61ff; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f9ab1"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="70" y="72">DPBS 选择缩略图</text>
  <text class="subtitle" x="70" y="112">不是只看“DPBS”名字，而是按用途选择 Ca/Mg、酚红、葡萄糖/丙酮酸和浓度版本</text>

  <rect class="main" x="430" y="170" width="340" height="155" rx="20"/>
  <text class="label" x="548" y="225">DPBS</text>
  <text class="text" x="475" y="265">Dulbecco 磷酸盐缓冲盐水</text>
  <text class="small" x="498" y="296">细胞培养常用 PBS 变体</text>

  <rect class="card" x="70" y="180" width="285" height="155" rx="18"/>
  <rect class="blue" x="95" y="205" width="86" height="30" rx="15"/>
  <text class="tag" x="113" y="226">消化前</text>
  <text class="label" x="95" y="272">无 Ca2+/Mg2+</text>
  <text class="text" x="95" y="306">无酚红、无菌 1×</text>

  <rect class="card" x="845" y="180" width="285" height="155" rx="18"/>
  <rect class="green" x="870" y="205" width="86" height="30" rx="15"/>
  <text class="tag" x="888" y="226">维持结构</text>
  <text class="label" x="870" y="272">可含 Ca2+/Mg2+</text>
  <text class="text" x="870" y="306">组织、黏附、灌流</text>

  <rect class="card" x="70" y="430" width="285" height="155" rx="18"/>
  <rect class="orange" x="95" y="455" width="86" height="30" rx="15"/>
  <text class="tag" x="113" y="476">读数实验</text>
  <text class="label" x="95" y="522">优先无酚红</text>
  <text class="text" x="95" y="556">显微、荧光、流式</text>

  <rect class="card" x="845" y="430" width="285" height="155" rx="18"/>
  <rect class="purple" x="870" y="455" width="86" height="30" rx="15"/>
  <text class="tag" x="888" y="476">短时支持</text>
  <text class="label" x="870" y="522">看葡萄糖/丙酮酸</text>
  <text class="text" x="870" y="556">运输、组织处理、assay</text>

  <path class="arrow" d="M355 255 H420"/>
  <path class="arrow" d="M780 255 H835"/>
  <path class="arrow" d="M355 505 C430 445 450 370 520 320"/>
  <path class="arrow" d="M845 505 C770 445 750 370 680 320"/>

  <rect class="warn" x="420" y="430" width="360" height="150" rx="16"/>
  <rect class="red" x="450" y="455" width="112" height="30" rx="15"/>
  <text class="tag" x="468" y="476">区别 PBS</text>
  <text class="label" x="450" y="522">DPBS 版本更多</text>
  <text class="small" x="450" y="552">普通 PBS 更通用；DPBS 更常用于细胞培养，</text>
  <text class="small" x="450" y="578">尤其要写清 Ca/Mg、酚红、葡萄糖/丙酮酸。</text>

  <text class="small" x="70" y="670">推荐默认：细胞消化前使用 sterile 1× DPBS, without Ca2+/Mg2+, without phenol red。</text>
</svg>

