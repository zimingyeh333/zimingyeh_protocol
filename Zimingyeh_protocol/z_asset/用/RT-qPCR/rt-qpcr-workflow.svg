<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">RT-qPCR workflow</title>
  <desc id="desc">A workflow figure showing RT-qPCR as a chain from sample design to RNA extraction, reverse transcription, qPCR amplification, quality control, and expression interpretation.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #cbd8e3; stroke-width: 2; rx: 16; }
      .main { fill: #eef7ff; stroke: #3a7ca5; stroke-width: 3; rx: 18; }
      .qc { fill: #fff6ed; stroke: #e6a15f; stroke-width: 2; rx: 16; }
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 40px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #4d6578; }
      .label { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 23px; font-weight: 700; fill: #17324d; }
      .text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #324c5f; }
      .small { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #516b7e; }
      .tag { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #7f9ab1; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .blue { fill: #2f80ed; }
      .green { fill: #219653; }
      .orange { fill: #f2994a; }
      .purple { fill: #7b61ff; }
      .red { fill: #eb5757; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f9ab1"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="70" y="70">RT-qPCR：从 RNA 到表达量结论</text>
  <text class="subtitle" x="70" y="108">每一步都可能改变结果；先做质控，再解释 fold change</text>

  <rect class="card" x="55" y="180" width="190" height="150" rx="16"/>
  <rect class="blue" x="80" y="205" width="72" height="28" rx="14"/>
  <text class="tag" x="99" y="225">设计</text>
  <text class="label" x="80" y="270">实验设计</text>
  <text class="small" x="80" y="302">分组、重复、引物</text>

  <rect class="card" x="285" y="180" width="190" height="150" rx="16"/>
  <rect class="green" x="310" y="205" width="72" height="28" rx="14"/>
  <text class="tag" x="329" y="225">RNA</text>
  <text class="label" x="310" y="270">RNA 提取</text>
  <text class="small" x="310" y="302">纯度、完整性、DNase</text>

  <rect class="card" x="515" y="180" width="190" height="150" rx="16"/>
  <rect class="orange" x="540" y="205" width="72" height="28" rx="14"/>
  <text class="tag" x="558" y="225">RT</text>
  <text class="label" x="540" y="270">逆转录</text>
  <text class="small" x="540" y="302">RNA 转为 cDNA</text>

  <rect class="card" x="745" y="180" width="190" height="150" rx="16"/>
  <rect class="purple" x="770" y="205" width="72" height="28" rx="14"/>
  <text class="tag" x="788" y="225">qPCR</text>
  <text class="label" x="770" y="270">实时扩增</text>
  <text class="small" x="770" y="302">Cq、熔解曲线、效率</text>

  <rect class="card" x="975" y="180" width="230" height="150" rx="16"/>
  <rect class="red" x="1000" y="205" width="72" height="28" rx="14"/>
  <text class="tag" x="1019" y="225">结果</text>
  <text class="label" x="1000" y="270">表达量解析</text>
  <text class="small" x="1000" y="302">ΔCq、ΔΔCq、统计</text>

  <path class="arrow" d="M245 255 H275"/>
  <path class="arrow" d="M475 255 H505"/>
  <path class="arrow" d="M705 255 H735"/>
  <path class="arrow" d="M935 255 H965"/>

  <rect class="main" x="110" y="435" width="310" height="135" rx="18"/>
  <text class="label" x="140" y="485">关键思想</text>
  <text class="text" x="140" y="522">不是只看 Cq 值</text>
  <text class="small" x="140" y="550">先确认样本、对照、效率和特异性</text>

  <rect class="qc" x="485" y="410" width="330" height="185" rx="16"/>
  <text class="label" x="515" y="462">必须检查的质控</text>
  <text class="text" x="515" y="500">NTC：污染/引物二聚体</text>
  <text class="text" x="515" y="532">no-RT：基因组 DNA</text>
  <text class="text" x="515" y="564">melt curve：扩增特异性</text>

  <rect class="main" x="880" y="435" width="300" height="135" rx="18"/>
  <text class="label" x="910" y="485">可靠结论</text>
  <text class="text" x="910" y="522">参考基因稳定</text>
  <text class="small" x="910" y="550">生物学重复用于统计</text>

  <path class="arrow" d="M420 505 H475"/>
  <path class="arrow" d="M815 505 H870"/>
  <text class="small" x="70" y="690">最常见失败链路：RNA 降解或污染 → 逆转录不稳定 → 非特异扩增 → 错误归一化 → fold change 不可信。</text>
</svg>

