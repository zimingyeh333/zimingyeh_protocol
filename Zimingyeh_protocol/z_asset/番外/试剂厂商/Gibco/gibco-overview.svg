<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Gibco system supplier logic</title>
  <desc id="desc">A cause-and-effect diagram explaining why Gibco is useful as a system-level cell culture supplier: cell culture has many hidden reagent variables, Gibco provides connected products and traceable documentation, and the result is easier reproduction and troubleshooting.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #cbd8e3; stroke-width: 2; rx: 16; }
      .main { fill: #edf6ff; stroke: #3a7ca5; stroke-width: 3; rx: 18; }
      .risk { fill: #fff6f2; stroke: #e6a184; stroke-width: 2; rx: 16; }
      .action { fill: #f3fbf5; stroke: #78b889; stroke-width: 2; rx: 16; }
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 40px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #4d6578; }
      .label { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 24px; font-weight: 700; fill: #17324d; }
      .text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 19px; fill: #324c5f; }
      .small { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #516b7e; }
      .tag { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #7f9ab1; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .muted { stroke: #b6c5d1; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowheadMuted); }
      .blue { fill: #2f80ed; }
      .green { fill: #219653; }
      .orange { fill: #f2994a; }
      .red { fill: #eb5757; }
      .gray { fill: #6b7f8f; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f9ab1"/>
    </marker>
    <marker id="arrowheadMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6c5d1"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="70" y="70">Gibco 的价值：把细胞培养变量变得可追踪</text>
  <text class="subtitle" x="70" y="108">选择体系化供应商，不是为了迷信品牌，而是为了减少配方、批次和记录不清带来的隐藏变量</text>

  <rect class="card" x="70" y="165" width="320" height="230" rx="16"/>
  <rect class="blue" x="95" y="192" width="78" height="30" rx="15"/>
  <text class="tag" x="113" y="213">问题</text>
  <text class="label" x="95" y="258">细胞培养变量复杂</text>
  <text class="text" x="95" y="302">培养基、血清、盐溶液</text>
  <text class="text" x="95" y="334">消化试剂、补充剂、冻存体系</text>
  <text class="small" x="95" y="370">任何一环变化都可能改变细胞状态</text>

  <rect class="main" x="480" y="145" width="320" height="270" rx="18"/>
  <rect class="green" x="505" y="172" width="96" height="30" rx="15"/>
  <text class="tag" x="523" y="193">Gibco</text>
  <text class="label" x="505" y="238">体系化控制点</text>
  <text class="text" x="505" y="282">1. 产品线相互衔接</text>
  <text class="text" x="505" y="314">2. 货号、批号、COA 可查</text>
  <text class="text" x="505" y="346">3. 配方版本和等级明确</text>
  <text class="small" x="505" y="382">目标：让问题能被定位，而不是只靠经验猜</text>

  <rect class="card" x="890" y="165" width="320" height="230" rx="16"/>
  <rect class="orange" x="915" y="192" width="78" height="30" rx="15"/>
  <text class="tag" x="933" y="213">结果</text>
  <text class="label" x="915" y="258">复现和排错更容易</text>
  <text class="text" x="915" y="302">长期 SOP 更稳定</text>
  <text class="text" x="915" y="334">多人协作更容易对齐</text>
  <text class="small" x="915" y="370">尤其适合敏感细胞、长期课题和药敏实验</text>

  <path class="arrow" d="M390 280 H470"/>
  <path class="arrow" d="M800 280 H880"/>

  <rect class="risk" x="70" y="470" width="550" height="160" rx="16"/>
  <rect class="red" x="95" y="497" width="114" height="30" rx="15"/>
  <text class="tag" x="113" y="518">风险对照</text>
  <text class="label" x="95" y="562">分散或资料不足的供应商组合</text>
  <text class="text" x="95" y="600">配方不清、批次信息少、质控文件缺失</text>
  <text class="small" x="95" y="627">表现为细胞状态漂移、重复失败、难以判断是哪一步出问题</text>

  <rect class="action" x="700" y="470" width="510" height="160" rx="16"/>
  <rect class="gray" x="725" y="497" width="114" height="30" rx="15"/>
  <text class="tag" x="743" y="518">记录原则</text>
  <text class="label" x="725" y="562">品牌名不够，必须记录版本</text>
  <text class="text" x="725" y="600">品牌 + 货号 + 批号 + 配方版本 + 质量等级</text>
  <text class="small" x="725" y="627">例如：DMEM high glucose, Gibco, Cat. No., Lot No.</text>

  <path class="muted" d="M620 550 H690"/>
  <text class="small" x="70" y="710">结论：Gibco 的优势不是“所有产品天然最好”，而是更容易把细胞培养体系中的隐藏变量写清、查清、复现清。</text>
</svg>
